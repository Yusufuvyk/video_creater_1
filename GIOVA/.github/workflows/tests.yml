# On every push and pull request: the linter, then every test on Windows (where GIOVA is released) and on
# Linux. The tests draw no windows on screen (Qt's offscreen platform) and need no EEG device.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff (the version in requirements-dev.txt)
        run: python -m pip install "$(grep -i '^ruff==' requirements-dev.txt)"
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Install the pinned packages
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m unittest discover -s tests -p "test_*.py"
